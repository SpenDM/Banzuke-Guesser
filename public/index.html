<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banzuke Guesser</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Banzuke Guesser</h1>
      <p id="subtitle">Loading…</p>
    </div>
    <div class="controls">
      <select id="basho-select" hidden aria-label="Previous tournament"></select>
      <span id="summary" class="summary"></span>
      <a id="submit-guess" class="button-link" href="https://sumodb.sumogames.de/gtb/GTBEntry.aspx" target="_blank" rel="noopener noreferrer">Submit Guess</a>
    </div>
  </header>

  <main id="app" class="panels">
    <aside class="panel tools">
      <h2>Tools</h2>
      <button id="apply-ideal" type="button">Apply Ideal Promotions</button>
      <button id="reset" type="button">Reset</button>
    </aside>
    <section class="panel">
      <h2><span id="basho-name">Previous</span> Results</h2>
      <div class="table-wrap"><table id="previous" class="banzuke previous"></table></div>
    </section>
    <section class="panel">
      <h2><span id="guess-name">Next</span> Banzuke Prediction</h2>
      <div class="table-wrap"><table id="guess" class="banzuke guess"></table></div>
    </section>
  </main>

  <footer class="foot">
    <span id="source"></span> ·
    Sources: <a href="https://www.sumo.or.jp/EnHonbashoBanzuke/index/">sumo.or.jp</a>, <a href="https://sumo-api.com/">sumo-api.com</a> ·
    <a href="https://github.com/SpenDM/Banzuke-Guesser">GitHub</a>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
