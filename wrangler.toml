# Cloudflare Worker: the static site in public/ served as assets, worker.js answering /api/*
# (handlers in functions/api) with the submissions in a D1 database. Deployed by Workers Builds
# on every push (`npx wrangler deploy`).
name = "banzuke-guesser"
main = "worker.js"
compatibility_date = "2025-07-18"

[assets]
directory = "./public"
binding = "ASSETS"
# Only the API reaches the Worker; every other path is served straight from the assets.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "banzuke-guesser"
database_id = "dbcf1ada-0d41-4140-ab2c-892bc5f667ca"
