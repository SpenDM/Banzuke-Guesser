[project]
name = "banzuke-guesser-scraper"
version = "0.1.0"
description = "Scrapes sumo.or.jp (with sumo-api.com fallback) into static JSON for the Banzuke Guesser site"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
